validation_rules:
  ohlc_check: "high >= low, high >= open, high >= close, low <= open, low <= close"
  price_positive: "all OHLC > 0"
  timestamp_monotonic: "strictly increasing"
  duplicate_timestamps: "zero tolerance"
  spread_nonnegative: "spread >= 0"

mtf_requirements:
  active_timeframes: ["1H", "30M", "15M", "5M"]
  fallback_chain: "5M -> 15M -> 30M -> 1H"
  notes: |
    MTF gate requires 15M for execution context (spread + ATR checks).
    15M is now resampled from 5M (fallback added in mtf_gate.py).
    30M resampled from 15M, 1H resampled from 30M.
    All timeframes use closed candles only (no look-ahead).

limitations:
  - "No M1 data available (execution refinement not possible in Phase 2)"
  - "2020 M5 data is daily bars, not true 5-minute bars"
  - "Real volume unavailable from Exness (tick_volume only)"
  - "No bid/ask data (spread only)"
  - "No commission/swap/slippage data (must use broker specs)"
  - "Processed H1 resampled from M5 differs from raw H1 (different source, extended coverage)"