[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-quant"
version = "0.1.0"
description = "M.A.R.S. — Mathematical Algorithm Risk System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["mars*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
